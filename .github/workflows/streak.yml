name: Update streak card

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streak

      - name: Fetch streak card (with retries, tolerant of slow origin)
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 90 -o streak.svg "https://streak-stats.demolab.com?user=KemoEmam&locale=en&mode=daily&theme=dracula&hide_border=false&border_radius=5" \
               && grep -q "Current Streak" streak.svg; then
              ok=1
              break
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          if [ "$ok" != "1" ]; then
            echo "All attempts failed; keeping yesterday's card"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          git diff --cached --quiet || { git commit -m "Update streak card"; git push; }
