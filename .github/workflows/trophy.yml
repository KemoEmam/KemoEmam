name: Update trophy card

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streak

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate trophy card
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/ryo-ma/github-profile-trophy /tmp/trophy
          cd /tmp/trophy
          deno run --allow-net --allow-env --allow-read --allow-write ./render_svg.ts KemoEmam "$GITHUB_WORKSPACE/trophy.svg" dracula
          grep -q "<svg" "$GITHUB_WORKSPACE/trophy.svg"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --cached --quiet || { git commit -m "Update trophy card"; git push; }
